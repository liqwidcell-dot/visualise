<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>visualise</title>
<style>
  /* Tokens copied from ~/projects/sketchback/src/styles.css (plan §27),
     bare-name form as in docs/index.html. Components use these only. */
  :root {
    color-scheme: light;
    --surface-base: #faf9f7;
    --surface-raised: #ffffff;
    --surface-sunken: #f0efec;
    --border-subtle: #e5e2dc;
    --text-primary: #1c1b19;
    --text-secondary: #6b6862;
    --accent: #3b6ea5;
    --on-accent: #ffffff;
    --danger: #a5453b;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", monospace;
    --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-base: #16161a;
      --surface-raised: #1e1e23;
      --surface-sunken: #101014;
      --border-subtle: #2a2a31;
      --text-primary: #e8e6e3;
      --text-secondary: #9a978f;
      --accent: #7aa8d8;
      --on-accent: #16161a;
      --danger: #d1706a;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-base);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.6;
    padding: 4rem 1.5rem;
  }
  .wrap { max-width: 46rem; margin: 0 auto; }

  h1 {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 0.25rem;
  }
  .tagline { color: var(--text-secondary); margin: 0 0 3rem; }

  .section-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    margin: 0 0 0.75rem;
  }

  textarea {
    width: 100%;
    min-height: 10rem;
    background: var(--surface-sunken);
    color: var(--text-primary);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-family: var(--font-mono);
    font-size: 0.875em;
    line-height: 1.5;
    resize: vertical;
  }
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .controls {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    margin: 1rem 0 2rem;
    flex-wrap: wrap;
  }
  button {
    background: var(--accent);
    color: var(--on-accent);
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    padding: 0.6rem 1.15rem;
    cursor: pointer;
    transition: filter 120ms var(--ease-standard);
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button.quiet {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
    font-weight: 400;
  }
  select {
    background: var(--surface-raised);
    color: var(--text-primary);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 0.55rem 0.75rem;
    font-family: var(--font-sans);
    font-size: 15px;
  }
  select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .error {
    color: var(--danger);
    font-size: 0.9375rem;
    margin: 0 0 1.5rem;
    display: none;
  }
  .error.shown { display: block; }

  #chart {
    background: var(--surface-raised);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 1.5rem;
    min-height: 12rem;
  }
  #chart svg { display: block; width: 100%; height: auto; }
  .empty {
    color: var(--text-secondary);
    text-align: center;
    padding: 3rem 0;
  }
  ::selection {
    background: color-mix(in oklab, var(--accent) 26%, transparent);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>visualise</h1>
  <p class="tagline">Paste JSON, get a chart. No build step, nothing leaves your browser.</p>

  <p class="section-label">Data</p>
  <textarea id="input" spellcheck="false" aria-label="JSON data">[
  { "label": "sketchback", "value": 42 },
  { "label": "paper-plugin", "value": 18 },
  { "label": "visualise", "value": 7 }
]</textarea>

  <div class="controls">
    <button id="render">Render</button>
    <select id="type" aria-label="Chart type">
      <option value="bar">Bar</option>
      <option value="line">Line</option>
    </select>
    <button id="sample" class="quiet">Sample data</button>
  </div>

  <p id="error" class="error" role="alert"></p>

  <div id="chart">
    <p class="empty">Press <strong>Render</strong> to draw the chart.</p>
  </div>
</div>

<script>
(function () {
  var input = document.getElementById('input');
  var chart = document.getElementById('chart');
  var errorEl = document.getElementById('error');
  var typeEl = document.getElementById('type');

  var SAMPLE = '[\n  { "label": "sketchback", "value": 42 },\n  { "label": "paper-plugin", "value": 18 },\n  { "label": "visualise", "value": 7 }\n]';

  function token(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function parse(text) {
    var data;
    try { data = JSON.parse(text); }
    catch (e) { throw new Error('That is not valid JSON — ' + e.message); }
    if (!Array.isArray(data) || data.length === 0) {
      throw new Error('Expected a non-empty JSON array, like [{"label": "a", "value": 1}].');
    }
    return data.map(function (d, i) {
      var value = Number(d.value !== undefined ? d.value : d);
      if (!isFinite(value)) {
        throw new Error('Item ' + (i + 1) + ' has no numeric "value".');
      }
      return { label: String(d.label !== undefined ? d.label : i + 1), value: value };
    });
  }

  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // SVG helpers — colours come from tokens, never literals.
  function barChart(data) {
    var W = 720, rowH = 34, gap = 10, padL = 140, padR = 60, padT = 8;
    var H = padT * 2 + data.length * rowH + (data.length - 1) * gap;
    var max = Math.max.apply(null, data.map(function (d) { return Math.abs(d.value); })) || 1;
    var plotW = W - padL - padR;
    var accent = token('--accent'), sunken = token('--surface-sunken'),
        textSec = token('--text-secondary'), border = token('--border-subtle');
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Bar chart">';
    data.forEach(function (d, i) {
      var y = padT + i * (rowH + gap);
      var w = Math.max(2, Math.abs(d.value) / max * plotW);
      out += '<text x="' + (padL - 10) + '" y="' + (y + rowH / 2) + '" text-anchor="end" dominant-baseline="central" font-size="13" fill="' + textSec + '">' + esc(d.label) + '</text>';
      out += '<rect x="' + padL + '" y="' + y + '" width="' + plotW + '" height="' + rowH + '" rx="4" fill="' + sunken + '" stroke="' + border + '"/>';
      out += '<rect x="' + padL + '" y="' + y + '" width="' + w + '" height="' + rowH + '" rx="4" fill="' + accent + '"/>';
      out += '<text x="' + (padL + w + 8) + '" y="' + (y + rowH / 2) + '" dominant-baseline="central" font-size="13" fill="' + textSec + '">' + d.value + '</text>';
    });
    return out + '</svg>';
  }

  function lineChart(data) {
    var W = 720, H = 320, padL = 48, padR = 20, padT = 20, padB = 40;
    var values = data.map(function (d) { return d.value; });
    var min = Math.min(0, Math.min.apply(null, values));
    var max = Math.max.apply(null, values);
    if (max === min) max = min + 1;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var accent = token('--accent'), textSec = token('--text-secondary'),
        border = token('--border-subtle');
    function X(i) { return padL + (data.length === 1 ? plotW / 2 : i / (data.length - 1) * plotW); }
    function Y(v) { return padT + (1 - (v - min) / (max - min)) * plotH; }
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Line chart">';
    // zero/base axis
    out += '<line x1="' + padL + '" y1="' + Y(Math.max(0, min)) + '" x2="' + (W - padR) + '" y2="' + Y(Math.max(0, min)) + '" stroke="' + border + '"/>';
    var pts = data.map(function (d, i) { return X(i) + ',' + Y(d.value); }).join(' ');
    out += '<polyline points="' + pts + '" fill="none" stroke="' + accent + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    data.forEach(function (d, i) {
      out += '<circle cx="' + X(i) + '" cy="' + Y(d.value) + '" r="3.5" fill="' + accent + '"/>';
      out += '<text x="' + X(i) + '" y="' + (H - padB + 22) + '" text-anchor="middle" font-size="12" fill="' + textSec + '">' + esc(d.label) + '</text>';
      out += '<text x="' + X(i) + '" y="' + (Y(d.value) - 10) + '" text-anchor="middle" font-size="12" fill="' + textSec + '">' + d.value + '</text>';
    });
    return out + '</svg>';
  }

  function render() {
    errorEl.classList.remove('shown');
    var data;
    try { data = parse(input.value); }
    catch (e) {
      errorEl.textContent = e.message;
      errorEl.classList.add('shown');
      return;
    }
    var svg = typeEl.value === 'line' ? lineChart(data) : barChart(data);
    chart.innerHTML = svg;
  }

  document.getElementById('render').addEventListener('click', render);
  document.getElementById('sample').addEventListener('click', function () {
    input.value = SAMPLE;
    render();
  });
  // Ctrl/Cmd+Enter renders from the textarea, like an editor.
  input.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') render();
  });
  // Redraw on theme change so SVG colours follow the palette.
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  // Render on load so the page is never an empty promise.
  render();
})();
</script>
</body>
</html>
