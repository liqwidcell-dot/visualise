<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>visualise</title>
<style>
  /* Tokens copied from ~/projects/sketchback/src/styles.css (plan §27).
     Components use these only; the page-ink pair is overridden by the
     contrast engine when a cover colour is active. */
  :root {
    color-scheme: light;
    --surface-base: #faf9f7;
    --surface-raised: #ffffff;
    --surface-sunken: #f0efec;
    --border-subtle: #e5e2dc;
    --text-primary: #1c1b19;
    --text-secondary: #6b6862;
    --accent: #3b6ea5;
    --on-accent: #ffffff;
    --danger: #a5453b;
    --page-ink: var(--text-primary);
    --page-ink-2: var(--text-secondary);
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", monospace;
    --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-base: #16161a;
      --surface-raised: #1e1e23;
      --surface-sunken: #101014;
      --border-subtle: #2a2a31;
      --text-primary: #e8e6e3;
      --text-secondary: #9a978f;
      --accent: #7aa8d8;
      --on-accent: #16161a;
      --danger: #d1706a;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page-bg, var(--surface-base));
    color: var(--page-ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Cover-colour drench: base wash + beat pulse layer, both fixed. */
  #bg {
    position: fixed; inset: 0;
    background: var(--page-bg, var(--surface-base));
    transition: background-color 600ms var(--ease-standard);
    z-index: -2;
  }
  #bg-pulse {
    position: fixed; inset: 0;
    background: var(--cover-color, transparent);
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 1.5rem 0.5rem;
    flex: none;
  }
  .mark { display: flex; align-items: center; gap: 0.6rem; }
  .mark-glyph {
    width: 32px; height: 32px;
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    background: var(--surface-raised);
    display: grid; place-items: center;
    flex: none;
  }
  h2 {
    font-size: 1rem; font-weight: 600; letter-spacing: -0.01em;
    margin: 0; line-height: 1.2;
  }
  .mark .sub { font-size: 0.72rem; color: var(--page-ink-2); line-height: 1.2; }
  #status {
    font-size: 0.8125rem;
    color: var(--page-ink-2);
    text-align: right;
    min-height: 1.4em;
  }
  #status.error { color: var(--danger); }

  /* --- Layout: art left, stage right ---------------------------------- */
  .app {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: min(38vmin, 420px, 60vh) 1fr;
    gap: clamp(1.25rem, 3vmin, 2.5rem);
    padding: 0.5rem 1.5rem 1.5rem;
  }
  .art-col {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  #art-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    transform-origin: center;
  }
  #rotor {
    position: absolute; inset: 0;
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface-sunken);
  }
  #art {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 220ms var(--ease-standard);
  }
  #art-frame[data-has-art="true"] #art { opacity: 1; }
  #grooves {
    position: absolute; inset: 0;
    opacity: 0;
    pointer-events: none;
    background: repeating-radial-gradient(circle at 50% 50%,
      transparent 0 7px,
      color-mix(in oklab, var(--text-primary) 13%, transparent) 7px 8px);
  }
  #sheen {
    position: absolute; inset: 0;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    background: conic-gradient(from 210deg,
      transparent 0deg,
      color-mix(in oklab, var(--surface-raised) 38%, transparent) 35deg,
      transparent 80deg);
  }
  #spindle {
    position: absolute; left: 50%; top: 50%;
    width: 13%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--surface-sunken);
    border: 1px solid var(--border-subtle);
    opacity: 0;
  }
  #art-ph {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: var(--page-ink-2);
  }
  #art-frame[data-has-art="true"] #art-ph { display: none; }

  #art-frame[data-mode="vinyl"] #rotor {
    border-radius: 50%;
    animation: spin 1.8s linear infinite;
    animation-play-state: paused;
  }
  #art-frame[data-mode="vinyl"][data-playing="true"] #rotor { animation-play-state: running; }
  #art-frame[data-mode="vinyl"] #grooves,
  #art-frame[data-mode="vinyl"] #sheen,
  #art-frame[data-mode="vinyl"] #spindle { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes art-enter {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }
  #art-frame.enter { animation: art-enter 420ms var(--ease-standard); }

  /* --- Stage ---------------------------------------------------------- */
  .stage {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    min-width: 0;
    min-height: 0;
  }
  #panel {
    position: relative;
    flex: 1;
    min-height: 150px;
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface-raised);
  }
  #viz { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .nowplaying { min-width: 0; }
  #title-wrap {
    margin: 0;
    overflow: hidden;
    white-space: nowrap;
  }
  #title {
    display: inline-block;
    font-size: clamp(1.3rem, 3.2vmin, 2rem);
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.2;
  }
  #title-wrap:not(.marquee) #title {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #title-wrap.marquee #title { animation: marquee 8s ease-in-out infinite alternate; }
  @keyframes marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(var(--shift, 0px)); }
  }
  #artist {
    font-size: 0.9375rem;
    color: var(--page-ink-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .seek-row { display: flex; align-items: center; gap: 0.75rem; }
  .seek-row.off { visibility: hidden; }
  .time {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--page-ink-2);
    width: 3.4rem;
    flex: none;
  }
  .time.right { text-align: right; }
  .track {
    flex: 1;
    height: 4px;
    background: var(--surface-sunken);
    border: 1px solid var(--border-subtle);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
  }
  #fill {
    position: absolute;
    left: -1px; top: -1px; bottom: -1px;
    width: 0;
    background: var(--accent);
    border-radius: 2px;
    pointer-events: none;
  }
  #dot {
    position: absolute;
    top: 50%;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 120ms var(--ease-standard);
    pointer-events: none;
  }
  .track:hover #dot, .track:focus-visible #dot { opacity: 1; }

  .controls { display: flex; align-items: center; gap: 0.75rem; }
  .ctl-label {
    font-size: 0.8125rem;
    color: var(--page-ink-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #id-row { gap: 0.5rem; }
  #id-input {
    flex: 1;
    min-width: 0;
    font-family: var(--font-sans);
    font-size: 0.875rem;
    color: var(--page-ink);
    background: var(--surface-sunken);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 0.45rem 0.65rem;
  }
  #id-input::placeholder { color: var(--page-ink-2); }
  #id-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #id-go { width: 34px; height: 34px; flex: none; }
  button {
    font-family: var(--font-sans);
    font-size: 15px;
    cursor: pointer;
    transition: filter 120ms var(--ease-standard),
                color 120ms var(--ease-standard),
                border-color 120ms var(--ease-standard);
  }
  button:focus-visible, .track:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .icon-btn {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    background: transparent;
    border: 1px solid var(--border-subtle);
    border-radius: 50%;
    color: var(--page-ink-2);
    padding: 0;
  }
  .icon-btn:hover { color: var(--page-ink); border-color: var(--page-ink-2); }
  .icon-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  a.icon-btn { text-decoration: none; }
  #play {
    width: 52px; height: 52px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    color: var(--on-accent);
    display: grid; place-items: center;
    padding: 0;
  }
  #play:hover { filter: brightness(1.08); }
  .spacer { flex: 1; }
  .services { display: none; gap: 0.5rem; }
  .services.shown { display: flex; }
  .segmented {
    display: inline-flex;
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    overflow: hidden;
  }
  .segmented button {
    background: transparent;
    border: none;
    color: var(--page-ink-2);
    font-size: 0.8125rem;
    padding: 0.4rem 0.75rem;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }
  .segmented button + button { border-left: 1px solid var(--border-subtle); }

  .hint {
    flex: none;
    margin: 0;
    padding: 0 1.5rem 1rem;
    font-size: 0.8125rem;
    color: var(--page-ink-2);
  }
  kbd {
    font-family: var(--font-mono);
    font-size: 0.78em;
    background: var(--surface-sunken);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 0.05em 0.38em;
  }
  ::selection { background: color-mix(in oklab, var(--accent) 26%, transparent); }
  audio { display: none; }

  /* --- Small screens -------------------------------------------------- */
  @media (max-width: 900px), (max-height: 560px) {
    body { overflow: auto; height: auto; }
    .app {
      grid-template-columns: 1fr;
      padding-bottom: 1rem;
    }
    .art-col { max-width: min(72vw, 320px); margin: 0 auto; width: 100%; }
    #panel { min-height: 220px; flex: none; height: 32vh; }
    .hint { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    #art-frame[data-mode="vinyl"] #rotor,
    #title-wrap.marquee #title,
    #art-frame.enter { animation: none; }
    #bg, #art, #dot { transition: none; }
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="bg-pulse"></div>

<header>
  <div class="mark">
    <span class="mark-glyph" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" style="color: var(--accent)">
        <rect x="1" y="6" width="3" height="4" rx="1.5"/>
        <rect x="6.5" y="2" width="3" height="12" rx="1.5"/>
        <rect x="12" y="5" width="3" height="6" rx="1.5"/>
      </svg>
    </span>
    <div>
      <h2>visualise</h2>
      <div class="sub">whatever's playing, seen</div>
    </div>
  </div>
  <div id="status" role="status">ready</div>
</header>

<main class="app">
  <section class="art-col">
    <div id="art-frame" data-mode="sleeve" data-has-art="false" data-playing="false">
      <div id="rotor">
        <img id="art" alt="">
        <div id="grooves"></div>
      </div>
      <div id="sheen"></div>
      <div id="spindle"></div>
      <div id="art-ph" aria-hidden="true">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
    </div>
    <div class="segmented" role="group" aria-label="Art style">
      <button id="art-sleeve" aria-pressed="true">Sleeve</button>
      <button id="art-vinyl" aria-pressed="false">Vinyl</button>
    </div>
  </section>

  <section class="stage">
    <div id="panel"><canvas id="viz" aria-label="Audio visualisation"></canvas></div>

    <div class="nowplaying">
      <h1 id="title-wrap"><span id="title">Nothing playing</span></h1>
      <div id="artist">Click play to capture what's playing, or drop a file</div>
    </div>

    <div id="seek-row" class="seek-row off">
      <span id="elapsed" class="time">0:00</span>
      <div id="seek" class="track" role="slider" tabindex="0"
           aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="fill"></div>
        <div id="dot"></div>
      </div>
      <span id="remaining" class="time right">0:00</span>
    </div>

    <!-- Capture mode has no duration and no transport, so this slot carries
         the identity field instead: type what is playing to get cover art. -->
    <div id="id-row" class="seek-row off">
      <input id="id-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="What's playing? Artist - Title, then Enter"
             aria-label="What's playing">
      <button id="id-go" class="icon-btn" aria-label="Find cover art" title="Find cover art">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/>
        </svg>
      </button>
    </div>

    <div class="controls">
      <button id="play" aria-label="Capture what's playing" title="Capture what's playing">
        <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 4.5v15l13-7.5z"/>
        </svg>
      </button>
      <span id="play-label" class="ctl-label">Capture what's playing</span>
      <div class="spacer"></div>
      <div id="services" class="services">
        <a id="svc-spotify" class="icon-btn" target="_blank" rel="noopener"
           aria-label="Search on Spotify" title="Search on Spotify">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
        </a>
        <a id="svc-ytm" class="icon-btn" target="_blank" rel="noopener"
           aria-label="Search on YouTube Music" title="Search on YouTube Music">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/></svg>
        </a>
      </div>
      <div class="segmented" role="group" aria-label="Visualisation mode">
        <button id="mode-bars" aria-pressed="true">Bars</button>
        <button id="mode-wave" aria-pressed="false">Waveform</button>
      </div>
    </div>
  </section>
</main>

<p class="hint"><kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> seek · drop an audio file
anywhere to play it locally · <kbd>▶</kbd> captures what's playing — in Chromium, share the tab that's playing</p>

<script>
(function () {
  'use strict';
  var BAR_COUNT = 48;
  var SMOOTH_UP = 0.55;
  var SMOOTH_DOWN = 0.12;
  var BEAT_COOLDOWN = 180;
  var RING_LIFE = 0.6;

  var canvas = $('viz'), c2d = canvas.getContext('2d');

  var statusEl = $('status'), bgPulse = $('bg-pulse');
  var seekRow = $('seek-row'), seekEl = $('seek'), fillEl = $('fill'), dotEl = $('dot');
  var elapsedEl = $('elapsed'), remainingEl = $('remaining');
  var playBtn = $('play'), playIcon = $('play-icon'), playLabel = $('play-label');
  var idRow = $('id-row'), idInput = $('id-input'), idGo = $('id-go');
  var modeBars = $('mode-bars'), modeWave = $('mode-wave');
  var sleeveBtn = $('art-sleeve'), vinylBtn = $('art-vinyl');
  var servicesEl = $('services'), svcSpotify = $('svc-spotify'), svcYtm = $('svc-ytm');
  var player = $('player');

  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Debug flags: ?debug=1 mirrors live state into <html data-viz>; ?q=<text>
  // pre-fills the identity field and runs the lookup (deterministic
  // screenshots of the art + colour path without capturing anything).
  var DEBUG = /[?&]debug=1/.test(location.search);
  var QUERY = (/[?&]q=([^&]*)/.exec(location.search) || [])[1];
  if (QUERY) QUERY = decodeURIComponent(QUERY.replace(/\+/g, ' '));
  var SELFTEST = /[?&]selftest=1/.test(location.search);

  var ICON = {
    play: 'M7 4.5v15l13-7.5z',
    pause: 'M6 4h4v16H6zM14 4h4v16h-4z',
    stop: 'M6 6h12v12H6z'
  };
  var IDLE_HINT = "Click play to capture what's playing, or drop a file";

  var audioCtx = null, analyser = null, muteGain = null, fileSource = null;
  var streamSource = null, captureStream = null, captureKind = null;
  var bins = null, waveArr = null;
  var displayed = new Float32Array(BAR_COUNT);
  var peaks = new Float32Array(BAR_COUNT);
  var beatHistory = [], lastBeat = 0, ringT = Infinity;
  var mode = 'bars';
  var fileMode = false, dragging = false;
  var objectUrl = null, artObjectUrl = null, artSeq = 0, idSeq = 0;
  var lastCover = null, levelPeak = 0;
  var identity = { artist: '', title: '', bare: true };

  // --- Tokens / theme ---------------------------------------------------
  function refreshTokens() {
    var cs = getComputedStyle(document.documentElement);
    ['surface-sunken', 'surface-raised', 'border-subtle', 'text-secondary', 'accent', 'surface-base']
      .forEach(function (t) { tokens[t] = cs.getPropertyValue('--' + t).trim(); });
    tokens.rgb = hexToRgb(tokens.accent);
    tokens.ring = tokens.ringOverride || tokens.accent;
    if (lastCover) applyCoverColour(lastCover);
  }
  function hexToRgb(hex) {
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(hex);
    if (!m) return '59,110,165';
    var h = m[1];
    if (h.length === 3) h = h.replace(/./g, function (c) { return c + c; });
    return parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16);
  }
  function parseColour(str) {
    if (!str) return null;
    str = str.trim();
    var hex = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(str);
    if (hex) {
      var h = hex[1];
      if (h.length === 3) h = h.replace(/./g, function (c) { return c + c; });
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    var rgb = /^rgba?\(([^)]+)\)$/i.exec(str);
    if (rgb) {
      var p = rgb[1].split(',').map(function (x) { return parseFloat(x); });
      if (p.length >= 3) return [p[0], p[1], p[2]];
    }
    return null;
  }
  function colourStr(rgb) {
    return 'rgb(' + rgb.map(function (v) { return Math.round(v); }).join(',') + ')';
  }
  var tokens = {};
  refreshTokens();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refreshTokens);

  // --- Contrast engine (pure, unit-tested) ------------------------------
  function srgbLum(rgb) {
    var f = function (v) {
      v /= 255;
      return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    };
    return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
  }
  function contrast(a, b) {
    var la = srgbLum(a), lb = srgbLum(b);
    var hi = Math.max(la, lb), lo = Math.min(la, lb);
    return (hi + 0.05) / (lo + 0.05);
  }
  function mixRgb(base, cov, f) {
    return [
      base[0] + (cov[0] - base[0]) * f,
      base[1] + (cov[1] - base[1]) * f,
      base[2] + (cov[2] - base[2]) * f
    ];
  }
  // Mix the cover colour into the theme base, backing the mix off until every
  // text token clears WCAG AA (4.5:1) against the result. Guarantees contrast
  // for any cover: no cover is allowed to make the text unreadable.
  function coverInk(base, cov) {
    var sets = {
      dark: { ink: [28, 27, 25], ink2: [74, 72, 68] },
      light: { ink: [242, 240, 236], ink2: [203, 199, 192] }
    };
    var steps = [0.34, 0.26, 0.18, 0.12, 0.07];
    for (var i = 0; i < steps.length; i++) {
      var bg = mixRgb(base, cov, steps[i]);
      var set = srgbLum(bg) > 0.42 ? sets.dark : sets.light;
      if (contrast(set.ink, bg) >= 4.5 && contrast(set.ink2, bg) >= 4.5) {
        return { bg: bg, ink: set.ink, ink2: set.ink2, mix: steps[i] };
      }
    }
    var bg0 = base.slice();
    var set0 = srgbLum(bg0) > 0.42 ? sets.dark : sets.light;
    return { bg: bg0, ink: set0.ink, ink2: set0.ink2, mix: 0 };
  }
  function dominantColour(img) {
    try {
      var c = document.createElement('canvas');
      c.width = c.height = 32;
      var x = c.getContext('2d', { willReadFrequently: true });
      x.drawImage(img, 0, 0, 32, 32);
      var d = x.getImageData(0, 0, 32, 32).data;
      var buckets = new Map();
      for (var i = 0; i < d.length; i += 4) {
        if (d[i + 3] < 200) continue;
        var k = ((d[i] >> 4) << 8) | ((d[i + 1] >> 4) << 4) | (d[i + 2] >> 4);
        var e = buckets.get(k) || { n: 0, r: 0, g: 0, b: 0 };
        e.n++; e.r += d[i]; e.g += d[i + 1]; e.b += d[i + 2];
        buckets.set(k, e);
      }
      var best = null;
      buckets.forEach(function (e) { if (!best || e.n > best.n) best = e; });
      if (!best) return null;
      return { r: best.r / best.n, g: best.g / best.n, b: best.b / best.n };
    } catch (e) {
      return null;   // tainted canvas or decode failure — keep theme colours
    }
  }
  function applyCoverColour(cov) {
    lastCover = cov;
    var base = parseColour(tokens['surface-base']) || [250, 249, 247];
    var res = coverInk(base, [cov.r, cov.g, cov.b]);
    var root = document.documentElement;
    var coverStr = colourStr([cov.r, cov.g, cov.b]);
    root.style.setProperty('--cover-color', coverStr);
    root.style.setProperty('--page-bg', colourStr(res.bg));
    root.style.setProperty('--page-ink', colourStr(res.ink));
    root.style.setProperty('--page-ink-2', colourStr(res.ink2));
    tokens.ringOverride = coverStr;
    tokens.ring = coverStr;
  }
  function clearCoverColour() {
    lastCover = null;
    tokens.ringOverride = null;
    tokens.ring = tokens.accent;
    var root = document.documentElement;
    ['--cover-color', '--page-bg', '--page-ink', '--page-ink-2']
      .forEach(function (v) { root.style.removeProperty(v); });
  }

  // --- Audio graph ------------------------------------------------------
  function ensureAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return Promise.resolve(true);
    }
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return Promise.resolve(false); }
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.82;
    bins = new Uint8Array(analyser.frequencyBinCount);
    waveArr = new Uint8Array(analyser.fftSize);
    // The analyser must be pulled by the destination path, but system audio
    // is already audible — so the downstream gain stays at zero.
    muteGain = audioCtx.createGain();
    muteGain.gain.value = 0;
    analyser.connect(muteGain);
    muteGain.connect(audioCtx.destination);
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return Promise.resolve(true);
  }

  // --- Capture: two in-browser routes, nothing to install ---------------
  //   tab      — getDisplayMedia on the tab that is playing. On Linux this is
  //              the only route that carries audio, and it is Chromium-only
  //              (Firefox cannot share audio at all).
  //   loopback — an input device that mirrors the output, when the browser
  //              exposes one. Chrome hides monitor sources; Firefox and
  //              PulseAudio setups with a virtual sink do not.
  // Whatever arrives goes into the analyser and nowhere else: nothing is
  // uploaded, and the tab keeps playing through its own output.
  var LOOPBACK_RE = /(monitor|loopback|stereo mix|what u hear|blackhole|virtual.*(sink|output)|output.*capture)/i;
  var ID_PLACEHOLDER = "What's playing? Artist - Title, then Enter";

  function listInputs() {
    var md = navigator.mediaDevices;
    if (!md || !md.enumerateDevices) return Promise.resolve([]);
    return md.enumerateDevices().then(function (all) {
      return all.filter(function (d) { return d.kind === 'audioinput'; });
    }).catch(function () { return []; });
  }

  function findLoopback(inputs) {
    for (var i = 0; i < inputs.length; i++) {
      if (inputs[i].label && LOOPBACK_RE.test(inputs[i].label)) return inputs[i];
    }
    return null;
  }

  // Raw capture: the browser defaults (echo cancellation, noise suppression,
  // auto gain) are tuned for speech and would chew up music.
  function micConstraints(deviceId) {
    var c = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    if (deviceId) c.deviceId = { exact: deviceId };
    return c;
  }

  function stopTracks(stream) {
    if (!stream) return;
    var t = stream.getTracks();
    for (var i = 0; i < t.length; i++) { try { t[i].stop(); } catch (e) {} }
  }

  function attachStream(stream, kind, label) {
    captureStream = stream;
    captureKind = kind;
    streamSource = audioCtx.createMediaStreamSource(stream);
    streamSource.connect(analyser);
    var audio = stream.getAudioTracks();
    for (var i = 0; i < audio.length; i++) {
      audio[i].addEventListener('ended', function () { stopCapture(true); });
    }
    // The video track is kept (and never drawn) on purpose: it is what makes
    // the browser's own "Stop sharing" bar work, and its 'ended' event is how
    // we learn that the user stopped sharing.
    beginCapture(kind, label);
    setStatus(kind === 'tab' ? 'capturing shared audio' : 'capturing system audio (loopback)');
  }

  function startCapture() {
    if (captureStream || fileMode) return Promise.resolve();
    return ensureRunning().then(function (ok) {
      if (!ok) { setStatus('audio is not available in this browser', true); return; }
      if (captureStream || fileMode) return;
      var md = navigator.mediaDevices;
      if (!md || !md.getDisplayMedia) return tryLoopback('this browser cannot share tab audio');
      setStatus('choose the tab that is playing…');
      return md.getDisplayMedia({
        video: { displaySurface: 'browser' },   // hint: the tab picker
        audio: {
          suppressLocalAudioPlayback: false,
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          systemAudio: 'include'
        },
        preferCurrentTab: false,
        selfBrowserSurface: 'exclude'
      }).then(function (stream) {
        if (stream.getAudioTracks().length) { attachStream(stream, 'tab', videoLabel(stream)); return; }
        stopTracks(stream);
        return tryLoopback('that share carried no audio');
      }).catch(function (err) {
        if (err && (err.name === 'NotAllowedError' || err.name === 'AbortError')) {
          setStatus('share cancelled — nothing captured');
          return;
        }
        return tryLoopback('screen sharing failed here');
      });
    }).catch(function () { setStatus('capture failed', true); });
  }

  function videoLabel(stream) {
    var v = stream.getVideoTracks()[0];
    return (v && v.label) || '';
  }

  // Second chance: some setups expose an input that mirrors the output. Input
  // labels stay hidden until the page has microphone permission, so when we
  // find nothing and permission has not been granted, ask once and look again
  // (that is the only way to reveal the labels).
  function tryLoopback(reason) {
    var md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) { setStatus(loopbackHelp(reason), true); return Promise.resolve(); }
    return listInputs().then(function (inputs) {
      var found = findLoopback(inputs);
      if (found) return openLoopback(found, reason);
      return micPermission().then(function (perm) {
        if (perm === 'granted') { setStatus(loopbackHelp(reason), true); return; }
        return md.getUserMedia({ audio: micConstraints(null) }).then(function (probe) {
          return listInputs().then(function (again) {
            var second = findLoopback(again);
            stopTracks(probe);
            if (!second) { setStatus(loopbackHelp(reason), true); return; }
            return openLoopback(second, reason);
          });
        });
      });
    }).catch(function () { setStatus(loopbackHelp(reason), true); });
  }

  function micPermission() {
    if (!navigator.permissions || !navigator.permissions.query) return Promise.resolve('prompt');
    return navigator.permissions.query({ name: 'microphone' })
      .then(function (p) { return p.state; })
      .catch(function () { return 'prompt'; });
  }

  function openLoopback(device, reason) {
    return navigator.mediaDevices.getUserMedia({ audio: micConstraints(device.deviceId) })
      .then(function (stream) { attachStream(stream, 'loopback', ''); })
      .catch(function () { setStatus(loopbackHelp(reason), true); });
  }

  function loopbackHelp(reason) {
    return reason + ' — click play again and share the tab that is playing (Firefox cannot share audio)';
  }

  function stopCapture(byBrowser) {
    if (streamSource) { try { streamSource.disconnect(); } catch (e) {} streamSource = null; }
    stopTracks(captureStream);
    captureStream = null;
    captureKind = null;
    if (fileMode) return;
    idRow.classList.add('off');
    clearCoverColour();
    artFrame.dataset.hasArt = 'false';
    artFrame.dataset.playing = 'false';
    titleEl.textContent = 'Nothing playing';
    artistEl.textContent = IDLE_HINT;
    titleWrap.classList.remove('marquee');
    servicesEl.classList.remove('shown');
    setStatus(byBrowser ? 'sharing stopped' : 'stopped');
    updatePrimary();
  }

  // --- What is playing? -------------------------------------------------
  // No browser can read another app's metadata, so a capture starts anonymous
  // ("Shared tab audio") and you name it. The name is only used to look up
  // cover art and to build the service links.
  function labelLooksLikeTrack(label) {
    if (!label) return false;
    if (/^(screen|entire screen|window|tab|browser tab|chrome tab|share|display)\b/i.test(label)) return false;
    if (/^\d+$/.test(label)) return false;
    if (label.length < 6 || label.length > 120) return false;
    return /[a-z]/i.test(label) && /\s/.test(label.trim());
  }

  function beginCapture(kind, label) {
    fileMode = false;
    identity = { artist: '', title: '', bare: true };
    titleEl.textContent = kind === 'tab' ? 'Shared tab audio' : 'System audio';
    artistEl.textContent = kind === 'tab'
      ? 'type what is playing below to get cover art'
      : 'loopback capture · type a track for cover art';
    marquee();
    artFrame.dataset.hasArt = 'false';
    artFrame.dataset.playing = 'true';
    servicesEl.classList.remove('shown');
    seekRow.classList.add('off');
    idRow.classList.remove('off');
    enterArt();
    clearCoverColour();
    var guess = labelLooksLikeTrack(label) ? label.trim() : '';
    idInput.placeholder = ID_PLACEHOLDER;
    idInput.value = guess;
    if (guess) setIdentity(guess);
    updatePrimary();
  }

  // --- Track identity ---------------------------------------------------
  var statusMsg = 'connecting…', statusError = false, needGesture = false;
  function setStatus(msg, isError) {
    statusMsg = msg;
    statusError = !!isError;
    applyStatus();
  }
  // Browsers hold a new AudioContext suspended until the page has seen a
  // gesture. Rather than burying that in the status line (where it would be
  // replaced by the next poll), prefix every status message until it is
  // resolved — and don't start capturing until the graph is really running.
  function applyStatus() {
    var text = (needGesture && !statusError) ? 'click anywhere to start listening · ' + statusMsg : statusMsg;
    if (statusEl.textContent !== text) statusEl.textContent = text;
    statusEl.classList.toggle('error', statusError);
  }

  function ensureRunning() {
    return ensureAudio().then(function () {
      if (audioCtx && audioCtx.state === 'running') { needGesture = false; applyStatus(); return true; }
      return audioCtx.resume().then(function () {
        if (audioCtx.state === 'running') { needGesture = false; applyStatus(); return true; }
        needGesture = true;
        return false;
      });
    }).catch(function () { return false; });
  }

  function marquee() {
    titleWrap.classList.remove('marquee');
    titleEl.style.removeProperty('--shift');
    // measure after layout
    requestAnimationFrame(function () {
      var over = titleEl.scrollWidth - titleWrap.clientWidth;
      if (over > 8 && !REDUCED) {
        titleEl.style.setProperty('--shift', '-' + (over + 8) + 'px');
        titleWrap.classList.add('marquee');
      }
    });
  }

  function enterArt() {
    if (REDUCED) return;
    artFrame.classList.remove('enter');
    void artFrame.offsetWidth;
    artFrame.classList.add('enter');
  }

  function loadArt(src, seq) {
    // crossOrigin keeps the pixels readable: the dominant colour comes from
    // getImageData, which a tainted canvas refuses. Both art sources in use
    // (iTunes artwork, blob URLs from a dropped file) allow it.
    var probe = new Image();
    probe.crossOrigin = 'anonymous';
    probe.onload = function () {
      if (seq !== artSeq) return;
      artImg.src = src;
      artFrame.dataset.hasArt = 'true';
      var cov = dominantColour(probe);
      if (cov) applyCoverColour(cov); else clearCoverColour();
      if (DEBUG) {
        window.__viz.lookup += ';img=ok;cover=' + (cov
          ? Math.round(cov.r) + ',' + Math.round(cov.g) + ',' + Math.round(cov.b) : 'none');
      }
    };
    probe.onerror = function () {
      if (seq !== artSeq) return;
      artFrame.dataset.hasArt = 'false';
      clearCoverColour();
      if (DEBUG) window.__viz.lookup += ';img=fail';
    };
    probe.src = src;
  }

  function splitIdentity(text) {
    var dash = /^(.+?)\s+[-\u2013\u2014]\s+(.+)$/.exec(text);
    if (dash) return { artist: dash[1].trim(), title: dash[2].trim(), bare: false };
    return { artist: '', title: text.trim(), bare: true };
  }

  // Name a capture by hand. The name is used for exactly two things: cover art
  // and the service links. Nothing else can know what is playing.
  function setIdentity(text) {
    text = String(text || '').trim();
    if (!text) { identity = { artist: '', title: '', bare: true }; clearCoverColour(); return; }
    var parsed = splitIdentity(text);
    identity = parsed;
    titleEl.textContent = parsed.title;
    artistEl.textContent = parsed.artist || '';
    marquee();
    updateLinks(parsed.artist, parsed.title);
    artFrame.dataset.hasArt = 'false';
    enterArt();
    clearCoverColour();
    if (idInput.value !== text) idInput.value = text;
    identify(parsed.artist, parsed.title, ++artSeq);
  }

  function updateLinks(artist, title) {
    if (!title && !artist) { servicesEl.classList.remove('shown'); return; }
    var q = encodeURIComponent((artist === 'Local file' ? '' : (artist || '') + ' ' + (title || '')).trim());
    svcSpotify.href = 'https://open.spotify.com/search/' + q;
    svcYtm.href = 'https://music.youtube.com/search?q=' + q;
    servicesEl.classList.add('shown');
  }

  // One contextual primary button: idle → start capturing, capturing → stop,
  // file → play/pause.
  function updatePrimary() {
    var icon, label;
    if (fileMode) {
      var playing = !player.paused;
      icon = playing ? ICON.pause : ICON.play;
      label = playing ? 'Pause' : 'Play';
    } else if (captureStream) {
      icon = ICON.stop;
      label = 'Stop capturing';
    } else {
      icon = ICON.play;
      label = "Capture what's playing";
    }
    playIcon.innerHTML = '<path d="' + icon + '"/>';
    playBtn.setAttribute('aria-label', label);
    playBtn.setAttribute('title', label);
    playLabel.textContent = label;
  }

  // --- Cover art from iTunes --------------------------------------------
  // MusicBrainz was the old source, but its images live on archive.org and
  // send no Access-Control-Allow-Origin, so the canvas could never read them
  // and the background could never take the cover's colour. iTunes' artwork
  // host does allow it, needs no key, and its search API is CORS-open too.
  var artCache = Object.create(null);
  var lastLookup = 0;

  function normName(s) {
    return String(s || '').toLowerCase()
      .replace(/\s*[\(\[]([^\)\]]*)[\)\]]/g, ' ')          // (Remastered 2011), [Live]
      .replace(/\s*[-\u2013\u2014]\s*(remaster(ed)?|feat\.?|ft\.?|with)\b.*$/i, ' ')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  function bigArtwork(url) {
    return url ? url.replace(/\/\d+x\d+([a-z]*)\./, '/600x600$1.') : null;   // 100x100bb → 600x600bb
  }

  function itunesQuery(artist, title) {
    var term = (artist && artist !== 'Local file') ? artist + ' ' + title : title;
    return 'https://itunes.apple.com/search?media=music&entity=song&limit=8&term=' + encodeURIComponent(term);
  }

  function pickTrack(results, artist, title) {
    var wantT = normName(title);
    var wantA = normName(artist === 'Local file' ? '' : artist);
    var best = null, bestScore = -1;
    for (var i = 0; i < (results || []).length; i++) {
      var r = results[i];
      if (!r || !r.artworkUrl100) continue;               // art is the point
      var t = normName(r.trackName), a = normName(r.artistName);
      var s = 0;
      if (t === wantT) s += 3;
      else if (t && wantT && (t.indexOf(wantT) === 0 || wantT.indexOf(t) === 0)) s += 1.5;
      if (wantA) {
        if (a === wantA) s += 2.5;
        else if (a.indexOf(wantA) !== -1 || wantA.indexOf(a) !== -1) s += 1.5;
        else s -= 2;                                     // an artist mismatch must not win
      }
      s += 0.5;                                          // has art
      if (s > bestScore) { bestScore = s; best = r; }
    }
    if (!best || bestScore < 2) return null;
    return {
      title: best.trackName,
      artist: best.artistName,
      album: best.collectionName,
      art: bigArtwork(best.artworkUrl100)
    };
  }

  function applyMatch(match, seq) {
    if (!match) return;
    // A bare title gets the matched artist filled in. A typed artist is left
    // alone, so a wrong match can never rewrite what you wrote.
    if (match.artist && !identity.artist) artistEl.textContent = match.artist;
    if (match.artist) updateLinks(identity.artist || match.artist, identity.title);
    if (match.art) loadArt(match.art, seq);
  }

  function identify(artist, title, seq) {
    if (!title) return;
    var key = normName(artist) + '|' + normName(title);
    if (key in artCache) { applyMatch(artCache[key], seq); return; }
    var mySeq = ++idSeq;
    var wait = Math.max(0, 400 - (Date.now() - lastLookup));
    setTimeout(function () {
      if (mySeq !== idSeq) return;                        // superseded by a newer lookup
      lastLookup = Date.now();
      var ctrl = new AbortController();
      var kill = setTimeout(function () { ctrl.abort(); }, 7000);
      fetch(itunesQuery(artist, title), { signal: ctrl.signal })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (j) {
          if (mySeq !== idSeq) return;
          var m = pickTrack(j.results, artist, title);
          artCache[key] = m;
          if (DEBUG) window.__viz.lookup = 'n=' + ((j.results || []).length) + ';pick=' + (m ? 'yes' : 'no');
          applyMatch(m, seq);
        })
        .catch(function (e) {                            // offline / rate-limited: keep the placeholder
          if (DEBUG) window.__viz.lookup = 'err:' + (e && e.name);   // eslint-disable-line no-unused-vars
          // A page opened straight from disk is an opaque origin: browsers
          // block its cross-origin fetches even though the API allows them,
          // so say why rather than silently showing nothing.
          setStatus(location.protocol === 'file:'
            ? 'cover lookup needs an http(s) page — open the hosted copy or serve this folder'
            : 'no cover art found — check the spelling or your connection', true);
        })
        .then(function () { clearTimeout(kill); });
    }, wait);
  }

  // --- Primary action + identity field ----------------------------------
  playBtn.addEventListener('click', function () {
    if (fileMode) { toggleFile(); return; }
    if (captureStream) { stopCapture(false); return; }
    startCapture();
  });

  idGo.addEventListener('click', function () { setIdentity(idInput.value); idInput.blur(); });
  idInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); setIdentity(idInput.value); idInput.blur(); }
  });

  // --- Embedded cover art -----------------------------------------------
  // Reads APIC/PIC out of ID3v2, covr out of MP4/M4A and PICTURE out of FLAC
  // straight from a dropped file: real art, offline, and readable pixels for
  // the colour engine (a blob URL is never tainted). Ogg is deliberately not
  // handled. Returns { mime, bytes } or null, and never throws.
  function extractEmbeddedArt(bytes) {
    'use strict';

    /* ------------------------------------------------------------------ */
    /* input normalisation                                                 */
    /* ------------------------------------------------------------------ */

    function normalise(input) {
      try {
        if (input === null || input === undefined) return null;
        if (typeof ArrayBuffer === 'undefined') return null;
        if (ArrayBuffer.isView && ArrayBuffer.isView(input)) {
          if (input.byteLength === 0) return null;
          return new Uint8Array(input.buffer, input.byteOffset, input.byteLength);
        }
        if (input instanceof ArrayBuffer) {
          return input.byteLength === 0 ? null : new Uint8Array(input);
        }
        if (typeof SharedArrayBuffer !== 'undefined' && input instanceof SharedArrayBuffer) {
          return input.byteLength === 0 ? null : new Uint8Array(input);
        }
        if (typeof input.length === 'number' && input.length > 0) {
          var copy = new Uint8Array(input.length);
          for (var i = 0; i < input.length; i++) copy[i] = input[i] & 0xff;
          return copy;
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    /* ------------------------------------------------------------------ */
    /* byte helpers                                                        */
    /* ------------------------------------------------------------------ */

    function readU32(buf, off) {
      return ((buf[off] << 24) | (buf[off + 1] << 16) | (buf[off + 2] << 8) | buf[off + 3]) >>> 0;
    }

    function readU24(buf, off) {
      return (buf[off] << 16) | (buf[off + 1] << 8) | buf[off + 2];
    }

    // 4 bytes, 7 significant bits each
    function readSynchsafe(buf, off) {
      return ((buf[off] & 0x7f) << 21) | ((buf[off + 1] & 0x7f) << 14) |
             ((buf[off + 2] & 0x7f) << 7) | (buf[off + 3] & 0x7f);
    }

    function latin1(buf, start, end) {
      var out = '';
      for (var i = start; i < end && i < buf.length; i++) out += String.fromCharCode(buf[i]);
      return out;
    }

    function startsWithAscii(buf, off, str) {
      if (off + str.length > buf.length) return false;
      for (var i = 0; i < str.length; i++) {
        if (buf[off + i] !== str.charCodeAt(i)) return false;
      }
      return true;
    }

    // Return the index just past the terminator, or -1.
    function findTerminator(buf, start, end, wide) {
      var i;
      if (wide) {
        // UTF-16: terminator is two zero bytes on an even offset from start.
        i = start;
        while (i + 1 < end) {
          if (buf[i] === 0 && buf[i + 1] === 0) return i + 2;
          i += 2;
        }
        return -1;
      }
      for (i = start; i < end; i++) {
        if (buf[i] === 0) return i + 1;
      }
      return -1;
    }

    /* ------------------------------------------------------------------ */
    /* image type sniffing                                                 */
    /* ------------------------------------------------------------------ */

    function sniffMime(buf, start, end) {
      var n = end - start;
      if (n >= 3 && buf[start] === 0xff && buf[start + 1] === 0xd8 && buf[start + 2] === 0xff) {
        return 'image/jpeg';
      }
      if (n >= 8 && buf[start] === 0x89 && buf[start + 1] === 0x50 && buf[start + 2] === 0x4e &&
          buf[start + 3] === 0x47 && buf[start + 4] === 0x0d && buf[start + 5] === 0x0a &&
          buf[start + 6] === 0x1a && buf[start + 7] === 0x0a) {
        return 'image/png';
      }
      if (n >= 6 && buf[start] === 0x47 && buf[start + 1] === 0x49 && buf[start + 2] === 0x46 &&
          buf[start + 3] === 0x38) {
        return 'image/gif';
      }
      if (n >= 12 && startsWithAscii(buf, start, 'RIFF') && startsWithAscii(buf, start + 8, 'WEBP')) {
        return 'image/webp';
      }
      if (n >= 2 && buf[start] === 0x42 && buf[start + 1] === 0x4d) {
        return 'image/bmp';
      }
      return null;
    }

    /* ------------------------------------------------------------------ */
    /* candidate collection + selection                                    */
    /* ------------------------------------------------------------------ */

    // A candidate is { mime, bytes, type, len }. `type` is the ID3/FLAC picture
    // type (3 = front cover); undefined for MP4 entries.
    function addCandidate(cands, buf, dataStart, dataEnd, declaredMime, pictureType) {
      if (dataEnd <= dataStart) return;
      var declared = (declaredMime || '').replace(/^\s+|\s+$/g, '').toLowerCase();
      // "-->" means the picture is a URL, not embedded data.
      if (declared === '-->') return;
      var mime = sniffMime(buf, dataStart, dataEnd);
      if (!mime && declared && declared.indexOf('image/') === 0) mime = declared;
      if (!mime) return;
      var data = buf.slice(dataStart, dataEnd); // copy, independent of source
      cands.push({ mime: mime, bytes: data, type: pictureType, len: data.length });
    }

    // Prefer ID3/FLAC front cover (type 3), else the largest picture.
    function selectBest(cands) {
      if (!cands.length) return null;
      var i, front = null, best = cands[0];
      for (i = 0; i < cands.length; i++) {
        if (cands[i].type === 3 && (front === null || cands[i].len > front.len)) {
          front = cands[i];
        }
        if (cands[i].len > best.len) best = cands[i];
      }
      var pick = front || best;
      return { mime: pick.mime, bytes: pick.bytes };
    }

    /* ------------------------------------------------------------------ */
    /* ID3v2                                                               */
    /* ------------------------------------------------------------------ */

    // Remove unsynchronisation: every 0xFF 0x00 becomes 0xFF.
    function deunsync(buf, start, end) {
      var i, count = 0;
      for (i = start; i + 1 < end; i++) {
        if (buf[i] === 0xff && buf[i + 1] === 0x00) { count++; i++; }
      }
      if (count === 0) return buf.slice(start, end);
      var out = new Uint8Array((end - start) - count);
      var j = 0;
      for (i = start; i < end; i++) {
        out[j++] = buf[i];
        if (buf[i] === 0xff && i + 1 < end && buf[i + 1] === 0x00) i++;
      }
      return out;
    }

    function apicV23(body, start, end, cands) {
      if (start >= end) return;
      var enc = body[start];
      var p = start + 1;
      var mimeEnd = -1;
      for (var i = p; i < end; i++) {
        if (body[i] === 0) { mimeEnd = i; break; }
      }
      if (mimeEnd < 0) return;
      var mime = latin1(body, p, mimeEnd);
      p = mimeEnd + 1;
      if (p >= end) return;
      var pictureType = body[p];
      p += 1;
      var wide = (enc === 1 || enc === 2);
      var dataStart = findTerminator(body, p, end, wide);
      if (dataStart < 0) return;
      addCandidate(cands, body, dataStart, end, mime, pictureType);
    }

    function picV22(body, start, end, cands) {
      if (start + 5 > end) return;
      var enc = body[start];
      var fmt = latin1(body, start + 1, start + 4).toUpperCase();
      var pictureType = body[start + 4];
      var p = start + 5;
      var mime = '';
      if (fmt === 'JPG' || fmt === 'JPEG') mime = 'image/jpeg';
      else if (fmt === 'PNG') mime = 'image/png';
      else if (fmt === 'GIF') mime = 'image/gif';
      else if (fmt === 'BMP') mime = 'image/bmp';
      var wide = (enc === 1 || enc === 2);
      var dataStart = findTerminator(body, p, end, wide);
      if (dataStart < 0) return;
      addCandidate(cands, body, dataStart, end, mime, pictureType);
    }

    function id3TagEnd(buf) {
      if (buf.length < 10 || !startsWithAscii(buf, 0, 'ID3')) return 0;
      var size = readSynchsafe(buf, 6);
      var end = 10 + size;
      if (buf[5] & 0x10) end += 10; // v2.4 footer, lives after the body
      return end;
    }

    function tryId3(buf) {
      if (buf.length < 10) return null;
      if (!startsWithAscii(buf, 0, 'ID3')) return null;
      var major = buf[3];
      var flags = buf[5];
      var size = readSynchsafe(buf, 6);
      if (size <= 0) return null;

      var tagEnd = 10 + size;
      if (tagEnd > buf.length) tagEnd = buf.length; // truncated tag: parse what we have

      var body = (flags & 0x80) ? deunsync(buf, 10, tagEnd) : buf.slice(10, tagEnd);
      var pos = 0;

      // Extended header: v2.4 size is synchsafe and includes its own 4 bytes;
      // v2.3 size is plain big-endian and excludes its own 4 bytes.
      if (flags & 0x40) {
        if (body.length < 4) return null;
        if (major >= 4) {
          pos = readSynchsafe(body, 0);
        } else {
          pos = 4 + readU32(body, 0);
        }
      }

      var cands = [];
      var frameLen = (major === 2) ? 6 : 10;
      var guard = 0;
      while (pos + frameLen <= body.length && guard++ < 200000) {
        var idLen = (major === 2) ? 3 : 4;
        var id = latin1(body, pos, pos + idLen);

        // Padding: an all-zero frame id ends the tag.
        var allZero = true;
        for (var z = 0; z < idLen; z++) {
          if (body[pos + z] !== 0) { allZero = false; break; }
        }
        if (allZero) break;
        if (!/^[A-Z0-9]+$/.test(id)) break; // bad frame id

        var fsize;
        if (major === 2) fsize = readU24(body, pos + 3);
        else if (major === 4) fsize = readSynchsafe(body, pos + 4);
        else fsize = readU32(body, pos + 4);

        var dataStart = pos + frameLen;
        var dataEnd = dataStart + fsize;
        if (fsize <= 0 || dataEnd > body.length) break; // malformed / runs past end

        if (major !== 2 && id === 'APIC') apicV23(body, dataStart, dataEnd, cands);
        else if (major === 2 && id === 'PIC') picV22(body, dataStart, dataEnd, cands);

        pos = dataEnd;
      }

      return selectBest(cands);
    }

    /* ------------------------------------------------------------------ */
    /* FLAC                                                                */
    /* ------------------------------------------------------------------ */

    function flacPicture(buf, start, end, cands) {
      var p = start;
      if (p + 8 > end) return;
      var pictureType = readU32(buf, p); p += 4;
      var mimeLen = readU32(buf, p); p += 4;
      if (p + mimeLen > end) return;
      var mime = latin1(buf, p, p + mimeLen); p += mimeLen;
      if (p + 4 > end) return;
      var descLen = readU32(buf, p); p += 4;
      if (p + descLen > end) return;
      p += descLen;
      if (p + 20 > end) return; // width, height, depth, colors, data length
      p += 16;
      var dataLen = readU32(buf, p); p += 4;
      if (dataLen === 0 || p + dataLen > end) return;
      addCandidate(cands, buf, p, p + dataLen, mime, pictureType);
    }

    function tryFlac(buf, base) {
      if (base + 4 > buf.length) return null;
      if (!startsWithAscii(buf, base, 'fLaC')) return null;
      var pos = base + 4;
      var cands = [];
      var guard = 0;
      while (pos + 4 <= buf.length && guard++ < 200000) {
        var head = buf[pos];
        var last = (head & 0x80) !== 0;
        var type = head & 0x7f;
        var len = readU24(buf, pos + 1);
        var bodyStart = pos + 4;
        var bodyEnd = bodyStart + len;
        if (type === 127) break; // invalid
        if (bodyEnd > buf.length) break; // truncated
        if (type === 6) flacPicture(buf, bodyStart, bodyEnd, cands);
        pos = bodyEnd;
        if (last) break;
      }
      return selectBest(cands);
    }

    /* ------------------------------------------------------------------ */
    /* MP4 / M4A                                                           */
    /* ------------------------------------------------------------------ */

    var KNOWN_TOP = {
      ftyp: 1, moov: 1, mdat: 1, free: 1, skip: 1, wide: 1, pnot: 1,
      styp: 1, uuid: 1, meta: 1, moof: 1, mfra: 1
    };

    // Parse one box header. Returns { type, dataStart, end } or null.
    function boxAt(buf, pos, limit) {
      if (pos + 8 > limit) return null;
      var size = readU32(buf, pos);
      var type = latin1(buf, pos + 4, pos + 8);
      var header = 8;
      if (size === 1) {
        if (pos + 16 > limit) return null;
        var hi = readU32(buf, pos + 8);
        var lo = readU32(buf, pos + 12);
        if (hi > 0x1fffff) return null; // > 2^53, refuse
        size = hi * 4294967296 + lo;
        header = 16;
      } else if (size === 0) {
        size = limit - pos; // extends to end of file
      }
      if (size < header) return null;
      var end = pos + size;
      if (end > limit) end = limit;
      return { type: type, dataStart: pos + header, end: end };
    }

    function walkCovr(buf, start, limit, cands) {
      var pos = start, guard = 0;
      while (pos + 8 <= limit && guard++ < 100000) {
        var box = boxAt(buf, pos, limit);
        if (!box) break;
        if (box.type === 'data' && box.end - box.dataStart >= 8) {
          var dtype = readU32(buf, box.dataStart);
          var low = dtype & 0xff;
          var code = 0;
          if (dtype === 13 || low === 13 || (dtype & 0xffffff) === 13) code = 13;
          else if (dtype === 14 || low === 14 || (dtype & 0xffffff) === 14) code = 14;
          var declared = code === 13 ? 'image/jpeg' : (code === 14 ? 'image/png' : '');
          addCandidate(cands, buf, box.dataStart + 8, box.end, declared, undefined);
        }
        if (box.end <= pos) break;
        pos = box.end;
      }
    }

    function walkIlst(buf, start, limit, cands) {
      var pos = start, guard = 0;
      while (pos + 8 <= limit && guard++ < 100000) {
        var box = boxAt(buf, pos, limit);
        if (!box) break;
        if (box.type === 'covr') walkCovr(buf, box.dataStart, box.end, cands);
        if (box.end <= pos) break;
        pos = box.end;
      }
    }

    function walkMeta(buf, start, limit, cands) {
      var pos = start, guard = 0;
      while (pos + 8 <= limit && guard++ < 100000) {
        var box = boxAt(buf, pos, limit);
        if (!box) break;
        if (box.type === 'ilst') walkIlst(buf, box.dataStart, box.end, cands);
        if (box.end <= pos) break;
        pos = box.end;
      }
    }

    function walkUdta(buf, start, limit, cands) {
      var pos = start, guard = 0;
      while (pos + 8 <= limit && guard++ < 100000) {
        var box = boxAt(buf, pos, limit);
        if (!box) break;
        // 'meta' is a full box: 4 bytes of version/flags precede its children.
        if (box.type === 'meta') walkMeta(buf, box.dataStart + 4, box.end, cands);
        if (box.end <= pos) break;
        pos = box.end;
      }
    }

    function walkMoov(buf, start, limit, cands) {
      var pos = start, guard = 0;
      while (pos + 8 <= limit && guard++ < 100000) {
        var box = boxAt(buf, pos, limit);
        if (!box) break;
        if (box.type === 'udta') walkUdta(buf, box.dataStart, box.end, cands);
        if (box.end <= pos) break;
        pos = box.end;
      }
    }

    function tryMp4(buf) {
      if (buf.length < 8) return null;
      // Only attempt an atom walk when the file plausibly is an MP4 container.
      if (!KNOWN_TOP[latin1(buf, 4, 8)]) return null;
      var cands = [];
      var pos = 0, guard = 0;
      while (pos + 8 <= buf.length && guard++ < 100000) {
        var box = boxAt(buf, pos, buf.length);
        if (!box) break;
        if (box.type === 'moov') walkMoov(buf, box.dataStart, box.end, cands);
        if (box.end <= pos) break;
        pos = box.end;
      }
      return selectBest(cands);
    }

    /* ------------------------------------------------------------------ */
    /* dispatch                                                            */
    /* ------------------------------------------------------------------ */

    try {
      var u8 = normalise(bytes);
      if (!u8) return null;

      if (startsWithAscii(u8, 0, 'ID3')) {
        var fromId3 = tryId3(u8);
        if (fromId3) return fromId3;
        // An ID3 tag may be prepended to a FLAC stream.
        var afterTag = id3TagEnd(u8);
        if (afterTag > 0 && afterTag < u8.length) {
          var flacAfterId3 = tryFlac(u8, afterTag);
          if (flacAfterId3) return flacAfterId3;
        }
        return null;
      }

      if (startsWithAscii(u8, 0, 'fLaC')) {
        return tryFlac(u8, 0);
      }

      // Ogg Vorbis/Opus is intentionally unsupported (see file header).
      var fromMp4 = tryMp4(u8);
      if (fromMp4) return fromMp4;

      return null;
    } catch (e) {
      return null;
    }
  }

  // --- File fallback (drag & drop anywhere) -----------------------------
  // Silent, no button: the page is about capturing what is already playing,
  // but a dropped file still works — and its embedded cover art is read
  // straight out of the file, so the colour drench works offline too.
  function fileArt(file) {
    // Whole file for normal sizes (MP4 keeps its tag at either end), a prefix
    // for big ones. Never throws: a file with no art just returns null.
    var slice = file.size <= 32 * 1024 * 1024 ? file : file.slice(0, 16 * 1024 * 1024);
    return slice.arrayBuffer().then(function (buf) {
      var got = extractEmbeddedArt(new Uint8Array(buf));
      if (!got || !got.bytes) return null;
      if (artObjectUrl) URL.revokeObjectURL(artObjectUrl);
      artObjectUrl = URL.createObjectURL(new Blob([got.bytes], { type: got.mime }));
      return artObjectUrl;
    }).catch(function () { return null; });
  }

  function loadFile(file) {
    ensureAudio().then(function () {
      fileMode = true;
      if (captureStream) stopCapture(true);
      if (!fileSource) fileSource = audioCtx.createMediaElementSource(player);
      try { fileSource.disconnect(); } catch (e) {}
      fileSource.connect(analyser);
      fileSource.connect(audioCtx.destination);   // a local file is audible
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      player.src = objectUrl;
      var names = parseName(file.name);
      identity = { artist: names.artist, title: names.title, bare: names.artist === 'Local file' };
      titleEl.textContent = names.title;
      artistEl.textContent = names.artist === 'Local file' ? '' : names.artist;
      marquee();
      updateLinks(names.artist, names.title);
      seekRow.classList.remove('off');
      idRow.classList.add('off');
      artFrame.dataset.hasArt = 'false';
      artFrame.dataset.playing = 'true';
      clearCoverColour();
      enterArt();
      var seq = ++artSeq;
      fileArt(file).then(function (blobUrl) {
        if (seq !== artSeq) return;
        if (blobUrl) loadArt(blobUrl, seq);
        else identify(names.artist, names.title, seq);
      });
      player.play().catch(function () {});
      updatePrimary();
      setStatus('local file · ' + file.name);
    });
  }
  function toggleFile() {
    if (player.paused) player.play().catch(function () {}); else player.pause();
    artFrame.dataset.playing = player.paused ? 'false' : 'true';
    updatePrimary();
  }
  player.addEventListener('play', updatePrimary);
  player.addEventListener('pause', updatePrimary);
  player.addEventListener('ended', function () {
    fileMode = false;
    updatePrimary();
    setStatus('file finished');
  });

  ['dragover', 'dragenter'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); });
  });
  document.addEventListener('drop', function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    if (f.type.indexOf('audio') === 0) loadFile(f);
    else setStatus('that file is not audio', true);
  });

  function parseName(name) {
    var base = name.replace(/\.[^.]+$/, '');
    var dash = base.match(/^(.+?)\s+-\s+(.+)$/);
    if (dash) return { artist: dash[1].trim(), title: dash[2].trim() };
    return { artist: 'Local file', title: base };
  }

  // --- Seeking (files only) ---------------------------------------------
  function seekTo(fraction) {
    if (fileMode && isFinite(player.duration) && player.duration > 0) {
      player.currentTime = Math.max(0, Math.min(1, fraction)) * player.duration;
    }
  }
  seekEl.addEventListener('pointerdown', function (e) {
    dragging = true;
    seekEl.setPointerCapture(e.pointerId);
    seekTo(eventFraction(e));
  });
  seekEl.addEventListener('pointermove', function (e) { if (dragging) seekTo(eventFraction(e)); });
  seekEl.addEventListener('pointerup', function () { dragging = false; });
  seekEl.addEventListener('keydown', function (e) {
    var step = 5;
    if (e.key === 'ArrowLeft') {
      e.preventDefault(); e.stopPropagation();
      seekBy(-step);
    } else if (e.key === 'ArrowRight') {
      e.preventDefault(); e.stopPropagation();
      seekBy(step);
    }
  });
  function seekBy(delta) {
    if (fileMode && isFinite(player.duration)) {
      player.currentTime = Math.max(0, Math.min(player.duration, player.currentTime + delta));
    }
  }
  function eventFraction(e) {
    var rect = seekEl.getBoundingClientRect();
    return (e.clientX - rect.left) / rect.width;
  }

  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.code === 'Space') {
      e.preventDefault();
      if (fileMode) toggleFile();
      else if (captureStream) stopCapture(false);
      else startCapture();
    } else if (e.key === 'ArrowLeft' && e.target !== seekEl) { e.preventDefault(); seekBy(-5); }
    else if (e.key === 'ArrowRight' && e.target !== seekEl) { e.preventDefault(); seekBy(5); }
  });

  // --- Init -------------------------------------------------------------
  // Capture always starts from a click (the picker and the AudioContext both
  // need one), so there is nothing to auto-start here.
  // ?q= pre-fills and resolves the identity field: used for deterministic
  // headless screenshots of the art + colour path.
  if (QUERY) { idRow.classList.remove('off'); setIdentity(QUERY); }
  setStatus('ready — nothing captured yet');
  updatePrimary();

  // --- Art mode + viz mode toggles --------------------------------------
  function setArtMode(next) {
    artFrame.dataset.mode = next;
    sleeveBtn.setAttribute('aria-pressed', String(next === 'sleeve'));
    vinylBtn.setAttribute('aria-pressed', String(next === 'vinyl'));
    try { localStorage.setItem('visualise.art', next); } catch (e) {}
  }
  sleeveBtn.addEventListener('click', function () { setArtMode('sleeve'); });
  vinylBtn.addEventListener('click', function () { setArtMode('vinyl'); });
  var savedArt = 'sleeve';
  try { savedArt = localStorage.getItem('visualise.art') || 'sleeve'; } catch (e) {}
  var artParam = /[?&]art=(sleeve|vinyl)/.exec(location.search);
  if (artParam) savedArt = artParam[1];
  setArtMode(savedArt);

  function setMode(next) {
    mode = next;
    modeBars.setAttribute('aria-pressed', String(mode === 'bars'));
    modeWave.setAttribute('aria-pressed', String(mode === 'wave'));
  }
  modeBars.addEventListener('click', function () { setMode('bars'); });
  modeWave.addEventListener('click', function () { setMode('wave'); });

  // --- Canvas -----------------------------------------------------------
  function fit() {
    var dpr = window.devicePixelRatio || 1;
    var w = panel.clientWidth, h = panel.clientHeight;
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    c2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(panel);
  window.addEventListener('resize', fit);
  fit();

  function bandValue(i, binCount) {
    var lo = i === 0 ? 0 : Math.floor(Math.pow(binCount, i / BAR_COUNT));
    var hi = Math.max(lo + 1, Math.floor(Math.pow(binCount, (i + 1) / BAR_COUNT)));
    var m = 0;
    for (var j = lo; j < hi && j < binCount; j++) if (bins[j] > m) m = bins[j];
    return m / 255;
  }

  function detectBeat(now) {
    var bass = 0;
    for (var i = 0; i < 12; i++) bass += bins[i];
    bass /= 12 * 255;
    beatHistory.push(bass);
    if (beatHistory.length > 60) beatHistory.shift();
    var avg = 0;
    for (var k = 0; k < beatHistory.length; k++) avg += beatHistory[k];
    avg /= beatHistory.length;
    if (bass > avg * 1.35 + 0.02 && bass > 0.25 && now - lastBeat > BEAT_COOLDOWN) {
      lastBeat = now;
      ringT = 0;
    }
  }

  function drawRing(w, h) {
    if (ringT === Infinity) return;
    ringT += 1 / 60;
    if (ringT > RING_LIFE) { ringT = Infinity; return; }
    var p = ringT / RING_LIFE;
    c2d.save();
    c2d.globalAlpha = (1 - p) * 0.5;
    c2d.strokeStyle = tokens.ring;
    c2d.lineWidth = 2;
    c2d.beginPath();
    c2d.arc(w / 2, h * 0.72, 30 + p * Math.max(w, h) * 0.45, 0, Math.PI * 2);
    c2d.stroke();
    c2d.restore();
  }

  function drawBars(w, h) {
    var gap = 3;
    var barW = Math.max(2, (w - gap * (BAR_COUNT - 1)) / BAR_COUNT);
    var maxH = h - 24;
    for (var i = 0; i < BAR_COUNT; i++) {
      var target = Math.pow(bandValue(i, analyser.frequencyBinCount), 0.85);
      displayed[i] += (target - displayed[i]) * (target > displayed[i] ? SMOOTH_UP : SMOOTH_DOWN);
      var level = displayed[i];
      if (level >= peaks[i]) peaks[i] = level;
      else peaks[i] = Math.max(0, peaks[i] - 0.007);
      var bh = Math.max(3, level * maxH);
      var x = i * (barW + gap);
      c2d.fillStyle = 'rgba(' + tokens.rgb + ',' + (0.55 + level * 0.45) + ')';
      c2d.beginPath();
      if (c2d.roundRect) {
        c2d.roundRect(x, h - bh, barW, bh, [3, 3, 3, 3]);
        c2d.fill();
      } else {
        c2d.fillRect(x, h - bh, barW, bh);
      }
      var py = h - Math.max(3, peaks[i] * maxH) - 4;
      c2d.fillStyle = 'rgba(' + tokens.rgb + ',1)';
      c2d.fillRect(x, py, barW, 2);
    }
  }

  function drawWave(w, h) {
    analyser.getByteTimeDomainData(waveArr);
    var mid = h / 2;
    c2d.strokeStyle = tokens['border-subtle'];
    c2d.lineWidth = 1;
    c2d.beginPath();
    c2d.moveTo(0, mid); c2d.lineTo(w, mid); c2d.stroke();
    var step = waveArr.length / w;
    function path(scale) {
      c2d.beginPath();
      for (var x = 0; x < w; x++) {
        var v = (waveArr[Math.floor(x * step)] - 128) / 128;
        var y = mid + v * (h * 0.42 * scale);
        if (x === 0) c2d.moveTo(x, y); else c2d.lineTo(x, y);
      }
      c2d.stroke();
    }
    c2d.lineJoin = 'round';
    c2d.strokeStyle = 'rgba(' + tokens.rgb + ',0.28)';
    c2d.lineWidth = 6;
    path(1.06);
    c2d.strokeStyle = tokens.accent;
    c2d.lineWidth = 2.5;
    path(1);
  }

  function fmt(s) {
    if (!isFinite(s) || s < 0) return '0:00';
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function renderProgress(pct, pos, len) {
    fillEl.style.width = (pct * 100) + '%';
    dotEl.style.left = (pct * 100) + '%';
    seekEl.setAttribute('aria-valuenow', Math.round(pct * 100));
    elapsedEl.textContent = fmt(pos);
    remainingEl.textContent = '-' + fmt(Math.max(0, len - pos));
  }

  // Debug hook for headless verification (also handy in the console).
  window.__viz = { frames: 0, level: 0, source: 'idle', lookup: '-' };
  function debugReport() {
    var cs = getComputedStyle(document.documentElement);
    document.documentElement.dataset.viz =
      'frames=' + window.__viz.frames +
      ';level=' + window.__viz.level.toFixed(4) +
      ';peak=' + levelPeak.toFixed(4) +
      ';source=' + window.__viz.source +
      ';art=' + artFrame.dataset.hasArt +
      ';mode=' + artFrame.dataset.mode +
      ';playing=' + artFrame.dataset.playing +
      ';bg=' + cs.getPropertyValue('--page-bg').trim() +
      ';ink=' + cs.getPropertyValue('--page-ink').trim() +
      ';lookup=' + window.__viz.lookup +
      ';status=' + statusEl.textContent.slice(0, 60) +
      ';title=' + titleEl.textContent.slice(0, 30);
  }

  function frame(now) {
    var w = panel.clientWidth, h = panel.clientHeight;
    c2d.fillStyle = tokens['surface-sunken'];
    c2d.fillRect(0, 0, w, h);

    var pulse = ringT === Infinity ? 0 : Math.max(0, 1 - ringT / RING_LIFE);
    if (!REDUCED) {
      bgPulse.style.opacity = (pulse * 0.13).toFixed(3);
      artFrame.style.transform = pulse > 0.01 ? 'scale(' + (1 + pulse * 0.03).toFixed(4) + ')' : '';
    }

    if (analyser && bins) {
      analyser.getByteFrequencyData(bins);
      detectBeat(now);
      drawRing(w, h);
      if (mode === 'wave') drawWave(w, h); else drawBars(w, h);
      var lvl = 0;
      for (var i = 0; i < 24; i++) lvl += bins[i];
      window.__viz.level = lvl / (24 * 255);
      if (window.__viz.level > levelPeak) levelPeak = window.__viz.level;
    }
    window.__viz.frames++;
    window.__viz.source = fileMode ? 'file' : (captureKind || 'idle');
    if (DEBUG) debugReport();

    // Progress (files carry their own duration; a capture has none)
    if (dragging) { /* user scrub wins */ }
    else if (fileMode) {
      var d = isFinite(player.duration) ? player.duration : 0;
      if (d > 0) renderProgress(player.currentTime / d, player.currentTime, d);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (DEBUG) debugReport();   // window.__viz exists by now; idle dumps are meaningful

  // ?selftest=1 — push a synthetic tone through the real capture path. No
  // permission, no picker and no sound (the analyser branch is muted), so it
  // is a one-click "do the meters actually move?" check. The tone is fed as a
  // MediaStream, exactly like a captured tab, so it exercises the same code.
  if (SELFTEST) {
    ensureAudio().then(function (ok) {
      if (!ok) return;
      var a = audioCtx.createOscillator(), b = audioCtx.createOscillator();
      a.frequency.value = 110; b.frequency.value = 440;
      var shape = audioCtx.createGain();
      shape.gain.value = 0.22;
      var dest = audioCtx.createMediaStreamDestination();
      a.connect(shape); b.connect(shape); shape.connect(dest);
      a.start(); b.start();
      attachStream(dest.stream, 'tab', '');
      titleEl.textContent = 'Self test tone';
      artistEl.textContent = 'synthetic 110 Hz + 440 Hz — the meters should move';
      setStatus('self test · synthetic tone, nothing captured');
    });
  }
})();
</script>
</body>
</html>
